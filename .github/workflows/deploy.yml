name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup rstats-on-nix cache
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - name: Extract data from Excel
        run: nix develop --command Rscript scripts/extract_data.R

      - name: Compile Quarto HTML document
        run: nix develop --command quarto render index.qmd

      - name: Prepare publication folder
        run: |
          mkdir -p public
          cp index.html public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
